---
- name: Corrected Playbook explicitly clearly for encrypted LVM resize
  hosts: zplayers_prod
  become: true

  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase"
      private: yes

  tasks:
    # TASK 1 (Combined package install explicitly and clevis-tpm binding):
    - name: Explicitly install packages and bind LUKS to TPM explicitly
      become: true
      shell: |
        set -e
        echo "[Explicitly] Updating package index and installing necessary packages explicitly."
        apt-get update || true
        apt-get install -y clevis clevis-luks clevis-tpm2 tpm2-tools \
          clevis-initramfs initramfs-tools tss2 rng-tools haveged cracklib-runtime firmware-misc-nonfree

        echo "[Explicitly] Setting up cracklib dictionary explicitly clearly."
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words || true
        ls -l /var/cache/cracklib/

        echo "[Explicitly] Enabling entropy explicitly."
        systemctl start rng-tools || true
        systemctl enable rng-tools || true
        systemctl start haveged || true
        systemctl enable haveged || true

        echo "[Explicitly] Binding LUKS partition explicitly to TPM."
        clevis luks bind -f -d /dev/nvme0n1p4 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,1,2,3,4,5,7"}' <<< "{{ luks_passphrase }}"

        echo "[Explicitly] Updating initramfs after clevis bind explicitly."
        update-initramfs -u -k all

        echo "[Explicitly] Explicitly verifying Clevis binding explicitly clearly."
        clevis luks list -d /dev/nvme0n1p4
      args:
        executable: /bin/bash

    # TASK 2 (Crypttab and initramfs fix explicitly):
    - name: Explicitly add/update /etc/crypttab for nvme0n1p4 explicitly and update initramfs explicitly
      become: true
      shell: |
        set -e
        UUID=$(blkid -s UUID -o value /dev/nvme0n1p4)
        [ -n "$UUID" ] || { echo "Couldn't explicitly find UUID of nvme0n1p4"; exit 1; }
        ENTRY="nvme0n1p4_crypt UUID=$UUID none luks,keyscript=/usr/bin/clevis-decrypt-tpm2"
        grep -q "^nvme0n1p4_crypt" /etc/crypttab && \
          sed -i "s#^nvme0n1p4_crypt.*#$ENTRY#" /etc/crypttab || \
          echo "$ENTRY" >> /etc/crypttab

        echo "[Explicitly] Final initramfs update explicitly clearly."
        update-initramfs -u -k all
      args:
        executable: /bin/bash
