---
- name: Automated LUKS/TPM Configuration Playbook
  hosts: zplayers_prod
  become: true

  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - clevis
          - clevis-luks
          - clevis-tpm2
          - tpm2-tools
          - clevis-initramfs
          - initramfs-tools
          - tss2
          - rng-tools
          - haveged
          - cracklib-runtime
          - firmware-misc-nonfree
        state: present
        update_cache: no

    - name: Get system storage layout
      shell: |
        echo "=== PHYSICAL PARTITIONS ==="
        lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINT
        echo "=== LVM SETUP ==="
        pvs
        vgs
        lvs
        echo "=== CRYPTO SETUP ==="
        dmsetup ls
        echo "=== CURRENT MAPPINGS ==="
        ls -l /dev/mapper/
      register: storage_info
      changed_when: false

    - name: Show storage information
      debug:
        msg: "{{ storage_info.stdout_lines }}"

    - name: Configure cracklib
      shell: |
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words || true
      args:
        executable: /bin/bash

    - name: Enable and start entropy services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - rng-tools
        - haveged
      ignore_errors: yes

    - name: Check encrypted partition details
      shell: |
        # Get nvme0n1p4 UUID directly (this is your encrypted root)
        echo "===== NVME0N1P4 ====="
        cryptsetup luksUUID /dev/nvme0n1p4 || echo "NOT_FOUND"
        # Get nvme0n1p8 UUID
        echo "===== NVME0N1P8 ====="
        cryptsetup luksUUID /dev/nvme0n1p8 || echo "NOT_FOUND"
      register: luks_info
      changed_when: false

    - name: Extract UUID
      set_fact:
        nvme_p4_uuid: "{{ luks_info.stdout_lines[1] }}"
        nvme_uuid: "{{ luks_info.stdout_lines[3] }}"
      when: luks_info.stdout_lines[1] != "NOT_FOUND" and luks_info.stdout_lines[3] != "NOT_FOUND"

    - name: Show raw output
      debug:
        msg: "{{ luks_info.stdout_lines }}"
        
    - name: Check if devices exist
      stat:
        path: "{{ item }}"
      register: device_check
      with_items:
        - /dev/nvme0n1p4    # Change this from /dev/sda3
        #- /dev/nvme0n1p8   # This is commented out

    - name: Fail if devices don't exist
      fail:
        msg: "Required devices not found"
      when: not device_check.results[0].stat.exists
      
- name: Create LUKS keys directory
  file:
    path: /etc/luks-keys
    state: directory
    mode: '0700'

- name: Generate LUKS key files
  shell: |
    dd if=/dev/urandom of=/etc/luks-keys/sda3_crypt.key bs=512 count=1
    dd if=/dev/urandom of=/etc/luks-keys/nvme0n1p8.key bs=512 count=1
    chmod 400 /etc/luks-keys/sda3_crypt.key
    chmod 400 /etc/luks-keys/nvme0n1p8.key
  args:
    creates: /etc/luks-keys/sda3_crypt.key

- name: Add keys to LUKS
  shell: |
    echo "{{ luks_passphrase }}" | cryptsetup luksAddKey /dev/nvme0n1p4 /etc/luks-keys/sda3_crypt.key
    echo "{{ luks_passphrase }}" | cryptsetup luksAddKey /dev/nvme0n1p8 /etc/luks-keys/nvme0n1p8.key
  no_log: true

- name: Configure crypttab with correct entries and key files
  copy:
    dest: /etc/crypttab
    content: |
      sda3_crypt UUID={{ nvme_p4_uuid }} /etc/luks-keys/sda3_crypt.key luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2
      nvme0n1p8_crypt UUID={{ nvme_uuid }} /etc/luks-keys/nvme0n1p8.key luks
    backup: yes
  when: nvme_p4_uuid is defined and nvme_p4_uuid != "NOT_FOUND"

    - name: Check if TPM binding exists
      shell: clevis luks list -d /dev/nvme0n1p4 | grep -q "tpm2"
      register: tpm_check
      ignore_errors: yes
      changed_when: false

    - name: Bind LUKS to TPM
      shell: |
        clevis luks bind -f -d /dev/nvme0n1p4 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,1,2,3,4,5,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash
      no_log: true
      when: tpm_check.rc != 0

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Success notification
      debug:
        msg: |
          ===========================================
          ✅ TPM/LUKS Configuration Complete
          ✅ Crypttab configured with correct UUID:
             - sda3_crypt: {{ nvme_p4_uuid }}
          ✅ Root partition bound to TPM
          ✅ Initramfs updated

          Ready for reboot!
          ===========================================
      when: nvme_p4_uuid is defined
