---
- name: Automated LUKS/TPM Configuration Playbook
  hosts: zplayers_prod
  become: true

  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - clevis
          - clevis-luks
          - clevis-tpm2
          - tpm2-tools
          - clevis-initramfs
          - initramfs-tools
          - tss2
          - rng-tools
          - haveged
          - cracklib-runtime
          - firmware-misc-nonfree
        state: present
        update_cache: no

    - name: Configure cracklib
      shell: |
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words || true
      args:
        executable: /bin/bash

    - name: Enable and start entropy services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - rng-tools
        - haveged
      ignore_errors: yes

    - name: Check encrypted partition details
      shell: |
        # Get sda3 UUID directly
        echo "===== SDA3 ====="
        cryptsetup luksUUID /dev/sda3 || echo "NOT_FOUND"

        echo "===== NVME ====="
        cryptsetup luksUUID /dev/nvme0n1p8 || echo "NOT_FOUND"
      register: luks_info
      changed_when: false

    - name: Show raw output
      debug:
        msg: "{{ luks_info.stdout_lines }}"

    - name: Check if devices exist
      stat:
        path: "{{ item }}"
      register: device_check
      with_items:
        - /dev/sda3
        - /dev/nvme0n1p8

    - name: Fail if devices don't exist
      fail:
        msg: "Required devices not found"
      when: not device_check.results[0].stat.exists or not device_check.results[1].stat.exists

    - name: Extract UUIDs
      set_fact:
        sda3_uuid: "{{ luks_info.stdout_lines[1] }}"
        nvme_uuid: "{{ luks_info.stdout_lines[3] }}"
      when: luks_info.stdout_lines[1] != "NOT_FOUND" and luks_info.stdout_lines[3] != "NOT_FOUND"

    - name: Configure crypttab with available entries
      copy:
        dest: /etc/crypttab
        content: "{{ crypttab_content }}"
        backup: yes
      vars:
        crypttab_content: |
          {%- if sda3_uuid != '' %}
          sda3_crypt UUID={{ sda3_uuid }} none luks,discard
          {%- endif %}
          {%- if nvme_uuid != '' %}
          nvme0n1p8_crypt UUID={{ nvme_uuid }} none luks
          {%- endif %}

    - name: Bind LUKS partitions to TPM
      shell: |
        clevis luks bind -f -d {{ item }} tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,1,2,3,4,5,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash
      with_items:
        - /dev/sda3
        - /dev/nvme0n1p8
      no_log: true  # Add this line

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Success notification
      debug:
        msg: |
          ===========================================
          ✅ TPM/LUKS Configuration Complete
          ✅ Crypttab configured with correct UUIDs:
             - sda3_crypt: {{ sda3_uuid }}
             - nvme0n1p8_crypt: {{ nvme_uuid }}
          ✅ Both partitions bound to TPM
          ✅ Initramfs updated

          Ready for reboot!
          ===========================================
