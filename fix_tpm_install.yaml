---
- name: Automated LUKS/TPM Configuration Playbook
  hosts: zplayers_prod
  become: true

  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - clevis
          - clevis-luks
          - clevis-tpm2
          - tpm2-tools
          - clevis-initramfs
          - initramfs-tools
          - tss2
          - rng-tools
          - haveged
          - cracklib-runtime
          - firmware-misc-nonfree
        state: present
        update_cache: no

    - name: Configure cracklib
      shell: |
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words || true
      args:
        executable: /bin/bash

    - name: Enable and start entropy services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - rng-tools
        - haveged
      ignore_errors: yes

    - name: Check encrypted partition details
      shell: |
        # First check if /dev/sda3 is a LUKS partition
        if cryptsetup isLuks /dev/sda3; then
          SDA3_UUID=$(cryptsetup luksUUID /dev/sda3)
          echo "SDA3_UUID=$SDA3_UUID"
        fi

        # Get nvme0n1p8 UUID
        if cryptsetup isLuks /dev/nvme0n1p8; then
          NVME_UUID=$(cryptsetup luksUUID /dev/nvme0n1p8)
          echo "NVME_UUID=$NVME_UUID"
        fi
      register: luks_info
      changed_when: false

    - name: Show detected LUKS devices
      debug:
        msg: "{{ luks_info.stdout_lines }}"

    - name: Extract UUIDs
      set_fact:
        sda3_uuid: "{{ luks_info.stdout | regex_search('SDA3_UUID=(.+)', '\\1') | first }}"
        nvme_uuid: "{{ luks_info.stdout | regex_search('NVME_UUID=(.+)', '\\1') | first }}"

    - name: Configure crypttab with correct entries
      copy:
        dest: /etc/crypttab
        content: |
          sda3_crypt UUID={{ sda3_uuid }} none luks,discard
          nvme0n1p8_crypt UUID={{ nvme_uuid }} none luks
        backup: yes

    - name: Bind LUKS partitions to TPM
      shell: |
        clevis luks bind -f -d {{ item }} tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,1,2,3,4,5,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash
      with_items:
        - /dev/sda3
        - /dev/nvme0n1p8

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Success notification
      debug:
        msg: |
          ===========================================
          ✅ TPM/LUKS Configuration Complete
          ✅ Crypttab configured with correct UUIDs:
             - sda3_crypt: {{ sda3_uuid }}
             - nvme0n1p8_crypt: {{ nvme_uuid }}
          ✅ Both partitions bound to TPM
          ✅ Initramfs updated

          Ready for reboot!
          ===========================================
