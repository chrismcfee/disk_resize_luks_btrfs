---
- name: Automated LUKS/TPM Configuration Playbook
  hosts: zplayers_prod
  become: true

  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - clevis
          - clevis-luks
          - clevis-tpm2
          - tpm2-tools
          - clevis-initramfs
          - initramfs-tools
          - tss2
          - rng-tools
          - haveged
          - cracklib-runtime
          - firmware-misc-nonfree
        state: present
        update_cache: no

    - name: Configure cracklib
      shell: |
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words || true
      args:
        executable: /bin/bash

    - name: Enable and start entropy services
      shell: |
        echo "[Explicitly] Enabling entropy explicitly." && systemctl start rng-tools haveged || true && systemctl enable rng-tools haveged || true
      ignore_errors: yes

    - name: Get UUIDs for encrypted partitions
      command: "blkid -s UUID -o value {{ item }}"
      register: uuid_results
      with_items:
        - /dev/sda3
        - /dev/nvme0n1p8
      changed_when: false

    - name: Configure crypttab with ONLY the two required entries
      copy:
        dest: /etc/crypttab
        content: |
          sda3_crypt UUID={{ uuid_results.results[0].stdout }} none luks,discard
          nvme0n1p8_crypt UUID={{ uuid_results.results[1].stdout }} none luks
        backup: yes

    - name: Bind LUKS to TPM for sda3
      shell: |
        clevis luks bind -f -d /dev/sda3 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,1,2,3,4,5,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash
    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Success notification
      debug:
        msg: |
          ===========================================
          ✅ TPM/LUKS Configuration Complete
          ✅ Crypttab configured with correct UUIDs
          ✅ Both partitions bound to TPM
          ✅ Initramfs updated

          Ready for reboot!
          ===========================================
