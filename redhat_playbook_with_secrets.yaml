---
- name: Reliable, Explicit SIMPLE Ansible playbook matching known-good bash scripts
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase explicitly"
      private: yes

  tasks:

    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no

    # Check explicitly if partition exists 
    - name: Check explicitly if partition /dev/nvme0n1p8 exists
      stat:
        path: /dev/nvme0n1p8
      register: nvme0n1p8_check

    # Create partition if missing explicitly
    - name: Create new partition explicitly only if not exist
      shell: |
        parted --script --align optimal /dev/nvme0n1 mkpart primary 193GB 100%
        partprobe /dev/nvme0n1
      when: not nvme0n1p8_check.stat.exists

    - name: Wait explicitly for partition availability
      wait_for:
        path: /dev/nvme0n1p8
        timeout: 60
      when: not nvme0n1p8_check.stat.exists

    # Check explicitly if device is already LUKS formatted
    - name: Check explicitly if LUKS is already formatted
      command: cryptsetup isLuks /dev/nvme0n1p8
      register: luks_check
      failed_when: false
      changed_when: false

    # Format LUKS & open explicitly only if not formatted yet
    - name: Format and open new LUKS device explicitly if needed
      shell: |
        set -e
        echo -n "{{ luks_passphrase }}" | cryptsetup luksFormat /dev/nvme0n1p8 -
        echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme0n1p8_crypt -
      when: luks_check.rc != 0
      args:
        executable: /bin/bash

    # Open LUKS explicitly only if formatted but not yet open
    - name: Check explicitly if LUKS already open
      stat:
        path: /dev/mapper/nvme0n1p8_crypt
      register: luks_opened_check

    - name: Explicitly open existing LUKS container if not open yet
      shell: |
        echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme0n1p8_crypt -
      when: luks_check.rc == 0 and not luks_opened_check.stat.exists
      args:
        executable: /bin/bash

    - name: Explicitly resize LUKS container without interactive prompt
      shell: |
        echo -n "{{ luks_passphrase }}" | cryptsetup resize nvme0n1p8_crypt -
      args:
        executable: /bin/bash

    # Check explicitly if PV already exists in VG
    - name: Check explicitly if PV exists in VG already
      shell: pvs --noheadings -o pv_name /dev/mapper/nvme0n1p8_crypt
      register: pv_exist
      failed_when: false
      changed_when: false

    # Create PV and extend VG explicitly only if PV does not exist
    - name: Create PV and extend VG explicitly if not present
      shell: |
        pvcreate /dev/mapper/nvme0n1p8_crypt
        vgextend VG0 /dev/mapper/nvme0n1p8_crypt
      when: pv_exist.stdout == ""
      args:
        executable: /bin/bash

    # Extend LV and Resize filesystem explicitly and safely
    - name: Extend LV and resize filesystem explicitly
      shell: |
        lvextend -l +100%FREE /dev/VG0/LG0
        #resize2fs /dev/mapper/VG0-LG0
      args:
        executable: /bin/bash

    # Update initramfs explicitly
    - name: Update initramfs explicitly
      shell: update-initramfs -u -k all
      args:
        executable: /bin/bash

    # Check existing TPM binding explicitly
    - name: Check for existing TPM binding
      shell: clevis luks list -d /dev/nvme0n1p8 | grep "tpm2"
      register: tpm_binding_check
      ignore_errors: true
      changed_when: false

    # Bind to TPM explicitly only if no binding exists
    - name: TPM Binding explicitly (idempotent)
      shell: |
        echo "set up cracklib dict now" &&
        mkdir -p /var/cache/cracklib || true &&
        create-cracklib-dict /usr/share/dict/words || true &&
        ls -l /var/cache/cracklib/ || true &&
        echo "^ numbers showing up here means cracklib is set up correctly (DEBUG STEP)" &&
        echo "enabling entrophy increase" &&
        systemctl start rng-tools || true &&
        systemctl enable rng-tools || true &&
        systemctl start haveged || true &&
        systemctl enable haveged || true &&
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}' <<< "{{ luks_passphrase }}"
      when: tpm_binding_check.rc != 0
      args:
        executable: /bin/bash

    # Reboot explicitly
    - name: Reboot explicitly after all steps
      reboot:
        reboot_timeout: 600

    # Verify after reboot explicitly
    - name: Verify filesystem explicitly after reboot
      shell: df -h /
      register: verify_output
      changed_when: false

    # Explicit success notification
    - name: Clear explicit successful step completion message
      debug:
        msg: |
          ✅ 🎉 Explicit Ansible replication of your working Bash scripts was successful!
          Filesystem root status after reboot:
          {{ verify_output.stdout }}
