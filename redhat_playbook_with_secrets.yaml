---
- name: Unified LUKS/LVM/TPM Management Playbook
  hosts: zplayers_prod
  become: true
  vars:
    crypt_name: nvme0n1p8_crypt
    vg_name: VG0
    tpm_pcrs: "0,7"
    luks_header_size: 16M

  tasks:
    # Common setup
    - name: Install cryptographic dependencies
      apt:
        name:
          - cryptsetup
          - lvm2
          - clevis
          - clevis-tpm2
          - tpm2-tools
          - initramfs-tools
        state: present
        update_cache: no
        ignore_errors: yes

    # LUKS/LVM Resize Section
    - name: Prepare LUKS device
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: opened
        name: "{{ crypt_name }}"
        passphrase: "{{ luks_passphrase }}"
        header_size: "{{ luks_header_size }}"

    - name: Extend physical volume
      lvol:
        vg: "{{ vg_name }}"
        pv: /dev/mapper/{{ crypt_name }}
        state: present

    - name: Resize logical volume with filesystem
      community.general.lvol:
        vg: "{{ vg_name }}"
        lv: root 
        size: +100%FREE
        resizefs: yes
        shrink: no

    # TPM Configuration Section
    - name: Bind LUKS to TPM
      block:
        - name: Check existing TPM binding
          command: clevis luks list -d /dev/nvme0n1p8
          register: tpm_check
          changed_when: false
          ignore_errors: yes

        - name: Create TPM binding
          command: >
            clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"{{ tpm_pcrs }}"}' -k -
          args:
            stdin: "{{ luks_passphrase }}"
          when: "'tpm2' not in tpm_check.stdout"
          no_log: true

    # Finalization
    - name: Update cryptographic services
      block:
        - name: Configure initramfs modules
          lineinfile:
            path: /etc/initramfs-tools/modules
            line: "{{ item }}"
            create: yes
          loop: [tpm, tpm_tis, tpm_crb]

        - name: Update crypttab
          lineinfile:
            path: /etc/crypttab
            line: "{{ crypt_name }} UUID=$(blkid -s UUID -o value /dev/nvme0n1p8) none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"
            regexp: "^{{ crypt_name }}"

        - name: Rebuild initramfs
          command: update-initramfs -u -k all

    - name: Validate full stack
      reboot:
        reboot_timeout: 600
      when: ansible_check_mode == false

    - name: Post-reboot verification
      command: lsblk -o NAME,FSTYPE,MOUNTPOINT
      register: storage_status
      changed_when: false

    - name: Final status
      debug:
        msg: |
          LUKS/LVM/TPM Configuration Complete
          ==================================
          - LUKS Header: {{ luks_header_size }}  
          - TPM PCRs: {{ tpm_pcrs }}
          - Volume Group: {{ vg_name }}
          - Active Mounts:
            {{ storage_status.stdout_lines | join('\n') }}
