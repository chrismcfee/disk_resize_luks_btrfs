---
- name: Explicit SIMPLE playbook matching known-good bash scripts
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase explicitly"
      private: yes

  tasks:

    - name: Install required tools explicitly
      apt:
        name:
        - cryptsetup
        - parted
        - lvm2
        - initramfs-tools
        - clevis
        - clevis-tpm2
        - tpm2-tools
        state: present
        update_cache: no

    - name: Check if partition explicitly exists
      stat:
        path: /dev/nvme0n1p8
      register: p8_check

    - name: Explicitly create new partition exactly like your WORKING SCRIPT does
      shell: |
        set -e
        parted /dev/nvme0n1 mkpart primary 180GB 100%
        partprobe /dev/nvme0n1
      when: not p8_check.stat.exists

    - name: Wait explicitly for partition creation explicitly
      wait_for:
        path: /dev/nvme0n1p8
        timeout: 30
      when: not p8_check.stat.exists

    - name: Explicitly set up LUKS device exactly as scripts do
      shell: |
        set -e
        echo -n "{{ luks_passphrase }}" | cryptsetup luksFormat /dev/nvme0n1p8 -
        echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme0n1p8_crypt -
      args:
        executable: /bin/bash
      when: not p8_check.stat.exists

    - name: Check if volume group contains the PV
      shell: pvs --select pv_name=/dev/mapper/nvme0n1p8_crypt --no-headings
      register: pv_check
      changed_when: false
      ignore_errors: true

    - name: Explicitly create PV and extend VG exactly like your shell script
      shell: |
        set -e
        pvcreate /dev/mapper/nvme0n1p8_crypt
        vgextend VG0 /dev/mapper/nvme0n1p8_crypt
      args:
        executable: /bin/bash
      when: pv_check.stdout == ""

    - name: Explicitly extend LV and resize filesystem EXACTLY like your script
      shell: |
        set -e
        lvextend -l +100%FREE /dev/VG0/LG0
        resize2fs /dev/mapper/VG0-LG0
      args:
        executable: /bin/bash

    - name: Explicitly resize LUKS container
      shell: cryptsetup resize nvme0n1p8_crypt

    - name: Explicitly update initramfs like your working script
      shell: update-initramfs -u -k all

    - name: TPM Binding explicitly (same as good bash-script commands)
      shell: |
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash

    - name: Reboot explicitly to confirm persistence 
      reboot:
        reboot_timeout: 600

    - name: Verify explicitly after reboot - matching bash script checks
      shell: df -h /
      register: verify_df
      changed_when: false

    - name: Explicit clear success notification
      debug:
        msg: |
          ✅ 🎉 Explicit Ansible replication of your working Bash scripts was successful explicitly!
          Filesystem root status after reboot:
          {{ verify_df.stdout }}
