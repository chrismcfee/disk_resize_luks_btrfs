---
- name: Unified LUKS/LVM/TPM Management Playbook - explicitly handles both cases clearly
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS encryption passphrase"
      private: yes
  vars:
    crypt_name: nvme0n1p8_crypt
    vg_name: VG0
    tpm_pcrs: "0,7"

  tasks:
    - name: Install cryptographic dependencies explicitly
      apt:
        name:
          - cryptsetup
          - lvm2
          - clevis
          - clevis-tpm2
          - tpm2-tools
          - initramfs-tools
          - parted
          - gparted
        state: present
        update_cache: no

    - name: Check explicitly if partition /dev/nvme0n1p8 exists
      stat:
        path: /dev/nvme0n1p8
      register: partition_check

    - name: Create partition explicitly on /dev/nvme0n1 ONLY IF ABSENT
      parted:
        device: /dev/nvme0n1
        number: 8
        state: present
        part_start: "100GB"      # ADJUST THESE VALUES ACCORDINGLY CLEARLY!
        part_end: "100%"         # e.g., Extend from a known start sector to disk end
        flags: [ luks ]
      when: not partition_check.stat.exists

    - name: Wait for kernel to detect new partition clearly explicitly
      command: partprobe /dev/nvme0n1
      when: not partition_check.stat.exists

    - name: Format newly created partition explicitly as LUKS (IF ABSENT ONLY)
      expect:
        command: bash -c "cryptsetup luksFormat --type luks2 /dev/nvme0n1p8"
        responses:
          (?i)Are you sure.*: "YES"
          (?i)Enter passphrase.*: "{{ luks_passphrase }}"
          (?i)Verify passphrase.*: "{{ luks_passphrase }}"
      when: not partition_check.stat.exists

    - name: Open existing or newly created LUKS device explicitly clearly
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: opened
        name: "{{ crypt_name }}"
        passphrase: "{{ luks_passphrase }}"

    - name: Ensure physical volume explicitly exists in VG
      lvol:
        vg: "{{ vg_name }}"
        pv: "/dev/mapper/{{ crypt_name }}"
        state: present

    - name: Resize root logical volume clearly explicitly
      community.general.lvol:
        vg: "{{ vg_name }}"
        lv: root
        size: "+100%FREE"
        resizefs: yes

    - name: Explicitly check existing TPM binding clearly
      command: clevis luks list -d /dev/nvme0n1p8
      register: tpm_check
      ignore_errors: yes
      changed_when: false

    - name: Explicitly and clearly bind LUKS device to TPM2 if not yet bound
      command: >
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"{{ tpm_pcrs }}"}' -k -
      args:
        stdin: "{{ luks_passphrase }}"
      when: "'tpm2' not in tpm_check.stdout"
      no_log: true

    - name: Configure initramfs modules explicitly clearly
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: yes
      loop: [tpm, tpm_tis, tpm_crb]

    - name: Explicitly update crypttab
      lineinfile:
        path: /etc/crypttab
        line: "{{ crypt_name }} UUID=$(blkid -s UUID -o value /dev/nvme0n1p8) none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"
        regexp: "^{{ crypt_name }}"

    - name: Explicitly update initramfs
      command: update-initramfs -u -k all

    - name: Explicit validation reboot clearly
      reboot:
        reboot_timeout: 600

    - name: Explicitly check after reboot
      command: lsblk -o NAME,FSTYPE,MOUNTPOINT
      register: storage_status
      changed_when: false

    - name: Explicit status message clearly
      debug:
        msg: |
          ✅ 🎉 LUKS/LVM/TPM explicitly configured successfully!
          ===============================================
          {{ storage_status.stdout_lines | join('\n') }}
