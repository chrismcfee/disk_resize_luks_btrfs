---
- name: Reliable, Explicit SIMPLE Ansible playbook matching known-good bash scripts (fully corrected)
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase explicitly"
      private: yes

  tasks:

    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no  # <-- Explicitly corrected from no to yes

    - name: do all step 1
      shell: |
        # Display current partition layout with free space information.
        echo "Current partition table and free space:"
        sudo parted /dev/nvme0n1 print free
        
        # Replace <start> with the actual start value from the 'free' output (for example, 180GB)
        START_VALUE=180GB
        
        # Create a new partition in the free space; this will likely be partition 8.
        sudo parted /dev/nvme0n1 mkpart primary $START_VALUE 100%
        
        # Inform the kernel of the new partition table.
        sudo partprobe /dev/nvme0n1
        
        # Create a Physical Volume on the new partition.
        sudo pvcreate /dev/nvme0n1p8
        
        # Add the new PV to your volume group.
        sudo vgextend VG0 /dev/nvme0n1p8
        
        # Extend the Logical Volume to use all available free space in VG0.
        sudo lvextend -l +100%FREE /dev/VG0/LG0
        
        # Resize the filesystem on the logical volume (assuming ext4).
        sudo resize2fs /dev/mapper/VG0-LG0
        
        echo "Root filesystem successfully extended."
    - name: "[Step 0] Fix /etc/sudoers.d ownership"
      block:
        - name: Fix directory ownership
          file:
            path: /etc/sudoers.d
            owner: root
            group: root
            recurse: yes

        - name: Fix file permissions
          file:
            path: /etc/sudoers.d
            mode: '0755'
            when: ansible_become

        - name: "[Step 1] Resize LUKS container"
          command: cryptsetup resize sda3_crypt
          changed_when: false
          tags: luks

        - name: "[Step 2] Resize physical volume"
          command: pvresize /dev/mapper/sda3_crypt
          changed_when: false
          tags: lvm

        - name: "[Step 3] Extend logical volume"
          command: lvextend -l +100%FREE /dev/VG0/LG0
          changed_when: false
          tags: lvm

        - name: "[Step 4] Resize Btrfs filesystem"
          command: btrfs filesystem resize max /
          changed_when: false
          tags: btrfs

        - name: "[Step 5] Update initramfs"
          command: update-initramfs -u -k all
          tags: initramfs

        - name: "[Step 6] Create cryptresize systemd service"
          block:
            - name: Create service file
              copy:
                dest: /etc/systemd/system/cryptresize.service
                content: |
                  [Unit]
                  Description=Resize LUKS container after boot
                  After=local-fs.target
                  Before=umount.target
    
                  [Service]
                  Type=oneshot
                  ExecStart=/usr/sbin/cryptsetup resize sda3_crypt
    
                  [Install]
                  WantedBy=multi-user.target

        - name: Enable and start service
          systemd:
            name: cryptresize.service
            enabled: yes
            daemon_reload: yes
          when: not ansible_check_mode
          tags: systemd

        - name: "[Verification] Filesystem usage"
          command: df -h /
          register: df_output
          changed_when: false
    
        - name: "[Verification] LVM physical volumes"
          command: pvs
          register: pvs_output
          changed_when: false
    
        - name: "[Verification] LVM volume groups"
          command: vgs
          register: vgs_output
          changed_when: false
    
        - name: "[Verification] Logical volume details"
          command: lvdisplay /dev/VG0/LG0
          register: lvdisplay_output
          changed_when: false
    
        - name: "[Verification] Btrfs filesystem usage"
          command: btrfs filesystem usage /
          register: btrfs_usage
          changed_when: false

        - name: Show final status
          debug:
            msg: |
              RESIZE PROCEDURE COMPLETE
              ==========================
              Filesystem Usage:
              {{ df_output.stdout }}
    
              Physical Volumes:
              {{ pvs_output.stdout }}
    
              Volume Groups:
              {{ vgs_output.stdout }}
    
              Logical Volume Details:
              {{ lvdisplay_output.stdout }}
    
              Btrfs Usage:
              {{ btrfs_usage.stdout }}
          tags: verification
