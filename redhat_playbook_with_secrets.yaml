---
- name: Unified LUKS/LVM/TPM Management Playbook (Corrected Explicitly)
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase explicitly"
      private: yes
  vars:
    crypt_name: nvme0n1p8_crypt
    vg_name: VG0
    tpm_pcrs: "0,7"

  tasks:
    - name: Install necessary dependencies explicitly
      apt:
        name:
          - cryptsetup
          - lvm2
          - clevis
          - clevis-tpm2
          - tpm2-tools
          - initramfs-tools
          - parted
        state: present
        update_cache: no  #nevar!

    # Check partition existence
    - name: Check partition explicitly
      stat:
        path: /dev/nvme0n1p8
      register: partition_check

    # Dynamically find available free space explicitly
    - name: Check disk free space explicitly
      command: parted /dev/nvme0n1 --script unit GB print free
      register: parted_output

    - name: Set next_free_start explicitly
      set_fact:
        next_free_start: "{{ (parted_output.stdout_lines | select('search','Free Space') | list | last).split()[0] }}"

    # Partition creation explicitly only if partition missing
    - name: Explicitly create new partition if missing
      parted:
        device: /dev/nvme0n1
        number: 8
        state: present
        part_start: "{{ next_free_start }}"
        part_end: "100%"
      when: not partition_check.stat.exists

    - name: Explicitly run partprobe after partitioning
      command: partprobe /dev/nvme0n1
      when: not partition_check.stat.exists

    - name: Wait explicitly for partition
      wait_for:
        path: /dev/nvme0n1p8
        timeout: 30
      when: not partition_check.stat.exists

    # Idempotently explicitly format the new partition if created (state=present)
    - name: Explicitly create LUKS device idempotently and securely
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: present
        passphrase: "{{ luks_passphrase }}"
      when: not partition_check.stat.exists

    # Explicitly open the LUKS device safely
    - name: Explicitly open the existing LUKS device
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: opened
        name: "{{ crypt_name }}"
        passphrase: "{{ luks_passphrase }}"

    # LVM management explicitly corrected
    - name: Explicitly add PV to VG if not present
      community.general.lvg:
        vg: "{{ vg_name }}"
        pvs: "/dev/mapper/{{ crypt_name }}"
        state: present

    - name: Explicitly resize root logical volume
      community.general.lvol:
        vg: "{{ vg_name }}"
        lv: root
        size: "+100%FREE"
        resizefs: yes

    # Get UUID correctly on TARGET host explicitly
    - name: Explicitly get UUID of /dev/nvme0n1p8
      command: blkid -s UUID -o value /dev/nvme0n1p8
      register: blkid_uuid
      changed_when: false

    # TPM binding explicitly safely
    - name: Check TPM binding explicitly
      command: clevis luks list -d /dev/nvme0n1p8
      register: tpm_check
      ignore_errors: yes
      changed_when: false

    - name: Bind LUKS to TPM explicitly if needed
      command: clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"{{ tpm_pcrs }}"}' -k -
      args:
        stdin: "{{ luks_passphrase }}"
      when: "'tpm2' not in tpm_check.stdout"
      no_log: true

    # Update crypttab explicitly correctly with UUID from host
    - name: Update /etc/crypttab explicitly
      lineinfile:
        path: /etc/crypttab
        line: "{{ crypt_name }} UUID={{ blkid_uuid.stdout }} none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"
        regexp: "^{{ crypt_name }}"

    - name: Configure initramfs explicitly
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: yes
      loop:
        - tpm
        - tpm_tis
        - tpm_crb

    - name: Explicitly update the initramfs
      command: update-initramfs -u -k all

    - name: Explicit validation reboot clearly
      reboot:
        reboot_timeout: 600

    - name: Explicitly check post-reboot
      command: lsblk -o NAME,FSTYPE,MOUNTPOINT
      register: storage_status
      changed_when: false

    - name: Explicit successful status message clearly
      debug:
        msg: |
          ✅ 🎉 LUKS/LVM/TPM explicitly configured successfully!
          ===============================================
          {{ storage_status.stdout_lines | join('\n') }}
