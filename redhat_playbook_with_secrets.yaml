---
- name: Reliable, Explicit SIMPLE Ansible playbook matching known-good bash scripts (fully corrected)
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter your LUKS encryption passphrase explicitly"
      private: yes

  tasks:

    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no  # <-- Explicitly corrected from no to yes

    - name: Check explicitly if partition /dev/nvme0n1p8 exists
      stat:
        path: /dev/nvme0n1p8
      register: nvme0n1p8_check

    - name: Create new partition explicitly only if not exist
      shell: |
        parted --script --align optimal /dev/nvme0n1 mkpart primary 193GB 100%
        partprobe /dev/nvme0n1
      when: not nvme0n1p8_check.stat.exists

    - name: Wait explicitly for partition availability
      wait_for:
        path: /dev/nvme0n1p8
        timeout: 60
      when: not nvme0n1p8_check.stat.exists

    - name: Check explicitly if LUKS is already formatted
      command: cryptsetup isLuks /dev/nvme0n1p8
      register: luks_check
      failed_when: false
      changed_when: false

    - name: Format and open new LUKS device explicitly if needed (force overwrite explicitly)
      shell: |
        set -e
        echo -n "{{ luks_passphrase }}" | cryptsetup luksFormat --force /dev/nvme0n1p8 -
        echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme0n1p8_crypt -
      args:
        executable: /bin/bash
      when: luks_check.rc != 0

    - name: Check explicitly if LUKS already open
      stat:
        path: /dev/mapper/nvme0n1p8_crypt
      register: luks_opened_check

    - name: Explicitly open existing LUKS container if not open yet
      shell: |
        echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme0n1p8_crypt -
      args:
        executable: /bin/bash
      when: luks_check.rc == 0 and not luks_opened_check.stat.exists

    - name: Resize physical volume explicitly
      command: pvresize /dev/mapper/nvme0n1p8_crypt
      when: luks_opened_check.stat.exists

    - name: Extend logical volume explicitly
      command: lvextend -l +100%FREE /dev/VG0/LG0
      when: luks_opened_check.stat.exists

    - name: Resize LUKS container explicitly
      command: cryptsetup resize nvme0n1p8_crypt
      when: luks_opened_check.stat.exists

    - name: Ensure filesystem expansion explicitly
      command: resize2fs -p /dev/mapper/VG0-LG0
      when: luks_opened_check.stat.exists

    - name: Check explicitly if PV already exists in VG
      shell: pvs --noheadings -o pv_name /dev/mapper/nvme0n1p8_crypt
      register: pv_exist
      failed_when: false
      changed_when: false

    - name: Create PV and extend VG explicitly only if PV not present
      shell: |
        pvcreate /dev/mapper/nvme0n1p8_crypt
        vgextend VG0 /dev/mapper/nvme0n1p8_crypt
      args:
        executable: /bin/bash
      when: pv_exist.stdout == ""

    - name: Update initramfs explicitly
      shell: update-initramfs -u -k all
      args:
        executable: /bin/bash

    - name: Check existing TPM binding explicitly
      shell: clevis luks list -d /dev/nvme0n1p8 | grep "tpm2"
      register: tpm_binding_check
      ignore_errors: true
      changed_when: false

    - name: TPM Binding explicitly only if no binding exists
      shell: |
        set -e
        mkdir -p /var/cache/cracklib
        create-cracklib-dict /usr/share/dict/words
        systemctl enable --now rng-tools
        systemctl enable --now haveged
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash
      when: tpm_binding_check.rc != 0

    - name: Reboot explicitly after all steps
      reboot:
        reboot_timeout: 600

    - name: Verify filesystem explicitly after reboot
      shell: df -h /
      register: verify_output
      changed_when: false

    - name: Clear explicit successful step completion message
      debug:
        msg: |
          ✅ 🎉 Explicit Ansible replication of your working Bash scripts was completely successful!
          Filesystem root status after reboot:
          {{ verify_output.stdout }}
