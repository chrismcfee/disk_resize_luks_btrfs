---
- name: Automated LUKS/TPM Configuration Playbook
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - clevis
          - clevis-luks
          - clevis-tpm2
          - tpm2-tools
          - clevis-initramfs
          - initramfs-tools
          - tpm2-abrmd
          - rng-tools
          - jq
          - cryptsetup
        state: present
        update_cache: yes

    - name: Gather block device info
      command: lsblk -J -o NAME,UUID,TYPE,FSTYPE,MOUNTPOINT
      register: lsblk_output
      changed_when: false

    - name: Extract root devices
      set_fact:
        encrypted_devices: "{{ (lsblk_output.stdout | from_json).blockdevices | selectattr('fstype', 'equalto', 'crypto_LUKS') | list }}"

    - name: Validate encrypted devices
      fail:
        msg: "No LUKS-encrypted devices found"
      when: encrypted_devices | length == 0

    - name: Configure entropy services
      systemd:
        name: rng-tools
        state: restarted
        enabled: yes

    - name: Create LUKS bindings
      block:
        - name: Check existing TPM binding
          command: clevis luks list -d "{{ item.path }}"
          register: clevis_check
          changed_when: false
          ignore_errors: yes

        - name: Bind device to TPM
          command: >
            clevis luks bind -d "{{ item.path }}" tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}' -k -
          args:
            stdin: "{{ luks_passphrase }}"
          when: "'tpm2' not in clevis_check.stdout"
          no_log: true
          loop: "{{ encrypted_devices }}"

    - name: Configure initramfs
      lineinfile:
        path: /etc/initramfs-tools/modules
        line: "{{ item }}"
        create: yes
      with_items:
        - tpm
        - tpm_tis
        - tpm_crb

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Verify TPM decryption
      reboot:
        reboot_timeout: 300
      when: ansible_check_mode == false

    - name: Post-reboot validation
      command: lsblk -o NAME,FSTYPE,MOUNTPOINT
      register: post_reboot_lsblk
      changed_when: false
