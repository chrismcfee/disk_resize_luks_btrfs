---
- name: Reliable LUKS/LVM Resize
  hosts: all
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS passphrase"
      private: yes

  tasks:
    - name: Install required tools explicitly
      apt:
        name:
         - cryptsetup
         - parted
         - lvm2
         - initramfs-tools
         - clevis
         - clevis-luks
         - clevis-initramfs
         - clevis-tpm2
         - tpm2-tools
         - firmware-misc-nonfree
         - rng-tools
         - haveged
         - tss2
         - cracklib-runtime
      state: present
      update_cache: no
    # Partitioning (exact copy of your bash logic)
    - name: Create partition explicitly
      shell: |
        parted --script /dev/nvme0n1 mkpart primary 180GB 100%
        partprobe /dev/nvme0n1
      args:
        executable: /bin/bash
      register: partition_creation
      failed_when: false  # Allow existing partitions

    # LUKS setup (atomic operations)
    - name: Configure LUKS encryption
      block:
        - name: Format LUKS container
          shell: |
            echo -n "{{ luks_passphrase }}" | cryptsetup luksFormat /dev/nvme0n1p8 -
          args:
            executable: /bin/bash

        - name: Open LUKS container
          shell: |
            echo -n "{{ luks_passphrase }}" | cryptsetup open /dev/nvme0n1p8 nvme_crypt -
          args:
            executable: /bin/bash

    # LVM operations (direct command equivalents)
    - name: Extend storage
      shell: |
        pvcreate /dev/mapper/nvme_crypt
        vgextend VG0 /dev/mapper/nvme_crypt
        lvextend -l +100%FREE /dev/VG0/LG0
        resize2fs /dev/mapper/VG0-LG0
      args:
        executable: /bin/bash

    # TPM auto-unlock (matches your systemd service)
    - name: Configure TPM binding
      shell: |
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}' <<< "{{ luks_passphrase }}"
      args:
        executable: /bin/bash

    # Final configuration (direct file manipulation)
    - name: Update crypttab
      lineinfile:
        path: /etc/crypttab
        line: "nvme_crypt UUID=$(blkid -s UUID -o value /dev/nvme0n1p8) none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"
        regexp: "^nvme_crypt"

    - name: Update initramfs
      command: update-initramfs -u -k all
      
    # Reboot handling
    - name: Reboot system
      reboot:
        reboot_timeout: 600
