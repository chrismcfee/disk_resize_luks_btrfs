---
- name: Reliable LUKS/LVM Resize
  hosts: all
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS passphrase"
      private: yes

  tasks:
    # Partitioning (exact copy of your bash logic)
    - name: Create partition explicitly
      shell: |
        parted --script /dev/nvme0n1 mkpart primary 180GB 100%
        partprobe /dev/nvme0n1
      args:
        executable: /bin/bash

    - name: Setup LUKS container
      block:
        - name: Format LUKS partition
          community.crypto.luks_device:
            device: /dev/nvme0n1p8
            state: present
            passphrase: "{{ luks_passphrase }}"
            type: luks2
            cipher: aes-xts-plain64
            keysize: 512
            hash: sha256
            pbkdf: argon2i
            pbkdf_parameters:
              time: 4        # Seconds (not milliseconds/iterations)
              memory: 1048576  # KB (1GB = 1048576KB)
              parallel: 4     # Thread count

        - name: Open LUKS container
          community.crypto.luks_device:
            device: /dev/nvme0n1p8
            state: opened
            name: crypt_root
            passphrase: "{{ luks_passphrase }}"

    # LVM Operations (raw commands)
    - name: Extend storage
      shell: |
        pvcreate /dev/mapper/nvme0n1p8_crypt
        vgextend VG0 /dev/mapper/nvme0n1p8_crypt
        lvextend -l +100%FREE /dev/VG0/LG0
        resize2fs /dev/mapper/VG0-LG0 || true
      args:
        executable: /bin/bash

    # Initramfs update
    - name: Update initramfs
      shell: update-initramfs -u -k all
      args:
        executable: /bin/bash

    - name: Configure automatic unlock
      lineinfile:
        path: /etc/crypttab
        line: "crypt_root UUID={{ ansible_devices.nvme0n1p8.luks.uuid }} none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"

    # Reboot handling
    - name: Reboot system
      reboot:
        reboot_timeout: 600
