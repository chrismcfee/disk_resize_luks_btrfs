---
- name: Reliable LUKS/LVM Management Playbook
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no  # <-- Explicitly corrected from no to yes

    - name: Check existing partition
      stat:
        path: /dev/nvme0n1p8
      register: partition_check

    - name: Create partition if missing
      parted:
        device: /dev/nvme0n1
        number: 8
        state: present
        part_start: "193GB"
        part_end: "100%"
        flags: [luks]
      when: not partition_check.stat.exists

    - name: Check LUKS status
      command: cryptsetup isLuks /dev/nvme0n1p8
      register: luks_check
      failed_when: false
      changed_when: false

    - name: Format LUKS container (idempotent)
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: present
        passphrase: "{{ luks_passphrase }}"
        force: yes  # Critical for overwriting existing headers
        type: luks2
      when: luks_check.rc != 0

    - name: Open LUKS container
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: opened
        name: nvme0n1p8_crypt
        passphrase: "{{ luks_passphrase }}"

    - name: Extend physical volume
      lvol:
        vg: VG0
        pv: /dev/mapper/nvme0n1p8_crypt
        state: present

    - name: Resize logical volume
      community.general.lvol:
        vg: VG0
        lv: LG0
        size: +100%FREE
        resizefs: yes

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Bind LUKS to TPM
      command: >
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}'
      args:
        stdin: "{{ luks_passphrase }}"
      when: "'tpm2' not in (clevis luks list -d /dev/nvme0n1p8 | grep tpm2)"

    - name: Reboot system
      reboot:
        reboot_timeout: 600
