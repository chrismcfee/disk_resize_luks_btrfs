---
- name: Reliable LUKS/LVM Management Playbook
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no  # <-- Explicitly corrected from no to yes

    - name: Check for existing partition
      stat:
        path: /dev/nvme0n1p8
      register: partition_check

    - name: Safely create partition on encrypted disk
      block:
        - name: Check for active mounts
          shell: lsblk -nl /dev/nvme0n1 | awk '{print $7}' | grep -v 'MOUNTPOINT'
          register: mounts
          changed_when: false
    
        - name: Unmount any active partitions
          mount:
            path: "{{ item }}"
            state: absent
          with_items: "{{ mounts.stdout_lines }}"
          when: mounts.stdout != ''
    
        - name: Destroy existing partition table (DANGEROUS)
          community.general.parted:
            device: /dev/nvme0n1
            label: gpt
            state: present
          when: partition_check.stat.exists
    
        - name: Create LUKS partition with proper alignment
          community.general.parted:
            device: /dev/nvme0n1
            number: 8
            state: present
            flags: [ boot ]
            part_start: "194GB"  # Adjusted for 1MB alignment
            part_end: "100%"
            align: optimal
      rescue:
        - name: Handle partition creation failure
          debug:
            msg: "Critical error occurred. Manual intervention required."

    - name: Verify LUKS status
      command: cryptsetup isLuks /dev/nvme0n1p8
      register: luks_check
      failed_when: false

    - name: Format LUKS container (idempotent)
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: present
        passphrase: "{{ luks_passphrase }}"
        force: yes
        type: luks2
      when: luks_check.rc != 0

    - name: Open LUKS container
      community.crypto.luks_device:
        device: /dev/nvme0n1p8
        state: opened
        name: nvme0n1p8_crypt
        passphrase: "{{ luks_passphrase }}"

    - name: Initialize physical volume
      community.general.lvg:
        vg: VG0
        pvs: /dev/mapper/nvme0n1p8_crypt
        pesize: 4

    - name: Extend logical volume
      community.general.lvol:
        vg: VG0
        lv: LG0
        size: +100%FREE
        resizefs: yes

    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Bind LUKS to TPM (idempotent)
      command: >
        clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}'
      args:
        stdin: "{{ luks_passphrase }}"
      when: "'tpm2' not in (clevis luks list -d /dev/nvme0n1p8 | grep tpm2)"

    - name: Final reboot
      reboot:
        reboot_timeout: 600
