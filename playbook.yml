---
- name: LUKS/LVM/TPM Automated Configuration
  hosts: all
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS encryption passphrase"
      private: yes

  tasks:
    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no

    - name: Check for existing partition
      stat:
        path: /dev/nvme0n1p8
      register: partition_check

    - name: Prepare disk partition
      block:
        - name: Unmount any active partitions
          mount:
            path: "{{ item }}"
            state: absent
          with_items: "{{ ansible_mounts | map(attribute='mount') | list }}"
          when: "'/dev/nvme0n1' in ansible_mounts | map(attribute='device') | list"

        - name: Create LUKS partition
          community.general.parted:
            device: /dev/nvme0n1
            number: 8
            state: present
            part_start: "1MiB"
            part_end: "100%"
            flags: [ luks ]
            align: optimal
          when: not partition_check.stat.exists

      rescue:
        - name: Handle partition errors
          debug:
            msg: "Partitioning failed! Ensure /dev/nvme0n1 is not in use."

    - name: Configure LUKS encryption
      block:
        - name: Check LUKS status
          command: cryptsetup isLuks /dev/nvme0n1p8
          register: luks_check
          failed_when: false

        - name: Create LUKS container
          community.crypto.luks_device:
            device: /dev/nvme0n1p8
            state: present
            passphrase: "{{ luks_passphrase }}"
            type: luks2
            cipher: aes-xts-plain64
            key_size: 512
            hash: sha256
          when: luks_check.rc != 0

        - name: Open LUKS container
          community.crypto.luks_device:
            device: /dev/nvme0n1p8
            state: opened
            name: nvme_crypt
            passphrase: "{{ luks_passphrase }}"

    - name: Configure LVM
      block:
        - name: Create physical volume
          community.general.parted:
            device: /dev/mapper/nvme_crypt
            state: present

        - name: Create volume group
          community.general.lvg:
            vg: vg_root
            pvs: /dev/mapper/nvme_crypt

        - name: Extend logical volume
          community.general.lvol:
            vg: vg_root
            lv: lv_root
            size: +100%FREE
            resizefs: yes

    - name: Configure TPM auto-unlock
      block:
        - name: Check existing TPM binding
          command: clevis luks list -d /dev/nvme0n1p8
          register: tpm_check
          changed_when: false
          ignore_errors: true

        - name: Bind LUKS to TPM
          command: >
            clevis luks bind -d /dev/nvme0n1p8 tpm2 '{"pcr_bank":"sha256","pcr_ids":"0,7"}'
          args:
            stdin: "{{ luks_passphrase }}"
          when: "'tpm2' not in tpm_check.stdout"

    - name: Finalize configuration
      block:
        - name: Update crypttab
          lineinfile:
            path: /etc/crypttab
            line: "nvme_crypt UUID={{ ansible_devices.nvme0n1p8.luks.uuid }} none luks,discard,keyscript=/usr/bin/clevis-decrypt-tpm2"

        - name: Update initramfs
          command: update-initramfs -u -k all

        - name: Reboot system
          reboot:
            reboot_timeout: 600
