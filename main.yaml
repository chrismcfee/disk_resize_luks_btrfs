---
- name: Reliable LUKS/LVM Resize
  hosts: zplayers_prod
  become: true
  vars_prompt: #do a flip!
    - name: luks_passphrase
      prompt: "Enter LUKS passphrase"
      private: yes

  tasks:
    # Step 1: Install required tools
    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no

    # Step 2: Partition Management
    - name: Configure partition
      ansible.builtin.include_tasks: tasks/partition.yaml

    # Step 3: Configure LUKS container
    - name: Configure LUKS container
      ansible.builtin.include_tasks: tasks/luks.yaml

    - name: Check if PV exists
      shell: pvs /dev/mapper/nvme_crypt --noheadings
      register: pv_check
      changed_when: false
    
    - name: Create PV only if missing
      shell: pvcreate /dev/mapper/nvme_crypt --force --yes
      when: pv_check.rc != 0


    - name: Extend VG0 with /dev/nvme0n1p8
      command: vgextend VG0 /dev/nvme0n1p8

    - name: Extend logical volume LG0
      command: lvextend -l +100%FREE /dev/VG0/LG0

    # Step 5: Filesystem Resize
    - name: Get filesystem type of root
      shell: df -T / | awk 'NR==2 {print $2}'
      register: fs_type

    - name: Resize ext4 filesystem
      command: resize2fs /dev/mapper/VG0-LG0
      when: fs_type.stdout == "ext4"

    - name: Resize Btrfs filesystem
      command: btrfs filesystem resize max /
      when: fs_type.stdout == "btrfs"

    # Step 6: Update initramfs
    - name: Update initramfs
      command: update-initramfs -u -k all

    - name: Create cryptresize service
      ansible.builtin.copy:
        dest: /etc/systemd/system/cryptresize.service
        content: |
          [Unit]
          Description=Resize LUKS container at boot
          After=systemd-cryptsetup@nvme_crypt.service
    
          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/cryptsetup resize nvme_crypt
    
          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'
    
    - name: Reload systemd daemon  # REQUIRED FOR NEW SERVICES
      ansible.builtin.systemd:
        daemon_reload: yes
    
    - name: Enable cryptresize service
      ansible.builtin.systemd:
        name: cryptresize.service
        enabled: yes
        state: started



    # Final Verification
    - name: Verify storage state
      ansible.builtin.include_tasks: tasks/verify.yaml
