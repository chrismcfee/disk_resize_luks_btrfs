---
- name: Reliable LUKS/LVM Resize
  hosts: zplayers_prod
  become: true
  vars_prompt:
    - name: luks_passphrase
      prompt: "Enter LUKS passphrase"
      private: yes

  tasks:
    # Step 1: Install required tools
    - name: Install required tools explicitly
      apt:
        name:
          - cryptsetup
          - parted
          - lvm2
          - initramfs-tools
          - clevis
          - clevis-luks
          - clevis-initramfs
          - clevis-tpm2
          - tpm2-tools
          - firmware-misc-nonfree
          - rng-tools
          - haveged
          - tss2
          - cracklib-runtime
        state: present
        update_cache: no

    # Step 2: Partition Management
    - name: Configure partition
      ansible.builtin.include_tasks:
        file: tasks/partition.yaml

    # Step 3: Reboot if partition missing (last resort)
    - name: Reboot if partition missing after creation.
      reboot:
        reboot_timeout: 600
      when: not p8_check_post.stat.exists

    # Step 4: Configure LUKS container
    - name: Configure LUKS container.
      ansible.builtin.include_tasks:
        file: tasks/luks.yaml

    # Step 5a: Create Physical Volume (PV)
    - name: Create physical volume on /dev/nvme0n1p8.
      command: pvcreate /dev/nvme0n1p8

    # Step 5b: Extend Volume Group (VG)
    - name: Extend VG0 with /dev/nvme0n1p8.
      command: vgextend VG0 /dev/nvme0n1p8

    # Step 5c: Extend Logical Volume (LV)
    - name: Extend logical volume LG0 to use all free space.
      command: lvextend -l +100%FREE /dev/VG0/LG0

    # Step 6a: Resize Filesystem (ext4)
    - name: Resize ext4 filesystem on LG0.
      command: resize2fs /dev/mapper/VG0-LG0

    # Step 6b (Optional): Resize Btrfs Filesystem (if applicable)
    - name: Resize Btrfs filesystem on root.
      command: btrfs filesystem resize max /
      when:
        - ansible_facts.filesystem_type == "btrfs"

    # Step 7a (Optional): Update Initramfs
    - name: Update initramfs to persist changes.
      command: update-initramfs -u -k all

    # Step 7b (Optional): Create Systemd Service for LUKS Resize on Boot
    - name: Create systemd service for LUKS resize on boot.
      shell: |
        cat > /etc/systemd/system/cryptresize.service <<EOF
        [Unit]
        Description=Resize LUKS container after boot
        After=local-fs.target
        Before=umount.target

        [Service]
        Type=oneshot
        ExecStart=/usr/sbin/cryptsetup resize sda3_crypt

        [Install]
        WantedBy=multi-user.target
        EOF
      args:
        executable: /bin/bash

    # Enable systemd service for LUKS resize on boot.
    - name: Enable cryptresize service.
      systemd:
        name: cryptresize.service
        enabled: true

    # Final Verification Steps
    - name: Verify current state of root filesystem.
      shell: df -h /
      register: df_output

    - name: Verify physical volumes.
      shell: pvs --noheadings --output pv_name,vg_name,size,free --units m | column -t
      register: pvs_output

    - name: Verify volume groups.
      shell: vgs --noheadings --output vg_name,size,free --units m | column -t
      register: vgs_output

    - name: Verify logical volumes.
      shell: lvdisplay /dev/VG0/LG0 | grep Size | column -t
      register: lvdisplay_output

    # Display final verification results.
    - name: Show final verification results.
      debug:
        msg:
          - "Root Filesystem Usage:\n{{ df_output.stdout }}"
          - "Physical Volumes:\n{{ pvs_output.stdout }}"
          - "Volume Groups:\n{{ vgs_output.stdout }}"
          - "Logical Volume Details:\n{{ lvdisplay_output.stdout }}"

