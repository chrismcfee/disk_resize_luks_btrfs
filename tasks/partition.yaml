---
- name: Check if partition /dev/nvme0n1p8 exists.
  stat:
    path: /dev/nvme0n1p8
  register: p8_check

- name: Debug partition existence.
  debug:
    msg: "Partition exists before creation? {{ p8_check.stat.exists }}"

- name: Get free space information for /dev/nvme0n1.
  shell: |
    parted /dev/nvme0n1 print free | awk '/Free Space/ {print $1, $2, $3}' | tail -n 1
  register: free_space
  changed_when: false
  when: not p8_check.stat.exists

- name: Debug free space information.
  debug:
    msg: "Free space on disk: {{ free_space.stdout }}"
  when: not p8_check.stat.exists

- name: Create partition using detected free space.
  shell: |
    start=$(echo "{{ free_space.stdout }}" | awk '{print $2}')
    end=$(echo "{{ free_space.stdout }}" | awk '{print $3}')
    parted --script /dev/nvme0n1 mkpart primary ext4 ${start} ${end}
    partprobe /dev/nvme0n1 && sleep 5 && lsblk | grep nvme0n1p8 || echo "Partition creation failed!"
  args:
    executable: /bin/bash
  when: not p8_check.stat.exists

- name: Verify partition existence post-creation.
  stat:
    path: /dev/nvme0n1p8
  register: p8_check_post

- name: Fail if partition not created successfully.
  fail:
    msg: "Partition /dev/nvme0n1p8 was not created successfully!"
  when:
    not p8_check_post.stat.exists

- name: Reboot if partition missing post-verification.
  reboot:
    reboot_timeout: 600
  when:
    not p8_check_post.stat.exists

- name: Wait for system to stabilize post-reboot.
  ansible.builtin.wait_for_connection:
    timeout: 600

- name: Retry checking partition existence after reboot.
  stat:
    path: /dev/nvme0n1p8
  register: retry_partition_check

- name: Fail if partition still missing after retry.
  fail:
    msg: "Partition /dev/nvme0n1p8 is still missing after retry!"
  when:
    not retry_partition_check.stat.exists
