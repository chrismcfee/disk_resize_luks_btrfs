- name: Check existing partition /dev/nvme0n1p8 exists.
  stat:
    path: /dev/nvme0n1p8
  register: p8_check

- name: Create partition if missing
  shell: |
    parted --script /dev/nvme0n1 mkpart primary ext4 180GB 100%
    partprobe /dev/nvme0n1 && sleep 5
  args:
    executable: /bin/bash
  when: not p8_check.stat.exists

- name: Verify partition existence post-creation
  stat:
    path: /dev/nvme0n1p8
  register: p8_check_post

- name: Check if partition exists before reboot
  ansible.builtin.stat:
    path: /dev/nvme0n1p8
  register: p8_check_pre

- name: Debug partition existence before reboot
  debug:
    msg: "Partition exists before reboot: {{ p8_check_pre.stat.exists }}"

- name: Reboot if partition missing
  reboot:
    reboot_timeout: 600
  when: not p8_check_post.stat.exists

- name: Check if partition exists after reboot
  ansible.builtin.stat:
    path: /dev/nvme0n1p8
  register: p8_check_post

- name: Debug partition existence after reboot
  debug:
    msg: "Partition exists after reboot: {{ p8_check_post.stat.exists }}"

- name: Create partition if missing
  shell: |
    parted --script /dev/nvme0n1 mkpart primary ext4 180GB 100%
    partprobe /dev/nvme0n1 && sleep 5 && lsblk | grep nvme0n1p8 || echo "Partition creation failed!"
  args:
    executable: /bin/bash
  when: not p8_check_pre.stat.exists

- name: Verify partition existence post-creation
  stat:
    path: /dev/nvme0n1p8
  register: p8_check_post

- name: Fail if partition not created successfully
  fail:
    msg: "Partition /dev/nvme0n1p8 was not created successfully!"
  when: not p8_check_post.stat.exists


- name: Set reboot flag
  set_fact:
    already_rebooted: true

- name: Reboot if partition missing and not already rebooted
  reboot:
    reboot_timeout: 600
  when:
    - not p8_check_post.stat.exists
    - not already_rebooted | default(false)
- name: Wait for system to stabilize post-reboot
  ansible.builtin.wait_for_connection:
    timeout: 600
    sleep: 10

- name: Retry checking for partition existence after delay
  shell: lsblk | grep nvme0n1p8 || echo "Partition still missing!"
  register: retry_partition_check

- name: Fail if partition still missing after retry
  fail:
    msg: "Partition /dev/nvme0n1p8 is still missing after retry!"
  when: "'Partition still missing!' in retry_partition_check.stdout"
