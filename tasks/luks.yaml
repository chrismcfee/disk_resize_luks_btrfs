---
- name: Format LUKS container if unformatted.
  shell: |
    echo -n "{{ luks_passphrase }}" | sudo cryptsetup luksFormat /dev/nvme0n1p8 --type luks2 --key-size=512 --hash=sha256 --cipher=aes-xts-plain64 --pbkdf=argon2id --batch-mode --force-password 
  args:
    executable: /bin/bash

- name: Open LUKS container.
  shell:
    cmd="echo '{{ luks_passphrase }}' | sudo cryptsetup open /dev/nvme01-LG01
