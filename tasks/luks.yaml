- name: Format LUKS container if unformatted
  shell: |
    echo -n "{{ luks_passphrase }}" | sudo cryptsetup luksFormat /dev/nvme0n1p8 --type luks2
  args:
    executable: /bin/bash

- name: Open LUKS container
  shell: echo -n "{{ luks_passphrase }}" | sudo cryptsetup open /dev/nvme0n1p8 nvme_crypt
  args:
    executable: /bin/bash

- name: Verify LUKS container is open
  shell: lsblk | grep -q nvme_crypt
  register: luks_open_check
  ignore_errors: true  # Prevent failure if container isn't open


- name: Fail if LUKS container is not open
  fail:
    msg: "Failed to open LUKS container nvme_crypt!"
  when: luks_open_check.rc != 0
